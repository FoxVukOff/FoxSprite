name: Windows x64

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022]
        include:
          - os: windows-2019
            target_name: windows-10-x64
          - os: windows-2022
            target_name: windows-11-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-x86_64-nodejs
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-giflib
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-pixman
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-tinyxml2
          mingw-w64-x86_64-v8
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libarchive

    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DUSE_V8_SANDBOX=ON ..
        make -j 4
        cd ..
        rm build/bin/gen.exe
        node package_win.js build/bin/libresprite.exe

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: foxsprite-development-${{ matrix.target_name }}
        path: |
          build/bin/*
